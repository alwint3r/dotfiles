interface:
  display_name: "Semantic Compression Refactor"
  short_description: "Refactor repeated code bottom-up from real instances"
  default_prompt: >-
    Use $semantic-compression-refactor to refactor existing code according to
    Casey Muratori's semantic-compression method. Inspect concrete working
    cases first, require at least two real instances before extracting reusable
    code, preserve unique behavior near its use, and introduce only the
    smallest shared operation or state representation justified by the code.
    Do not design speculative abstractions, frameworks, or class hierarchies.
    Validate behavior and relevant performance after each incremental change.
