interface:
  display_name: "Exec Planner"
  short_description: "Create robust, executable implementation plans"
  default_prompt: >-
    Use $exec-planner to create one self-contained ExecPlan. Respect the
    requested delivery format and path. Treat tool availability as distinct
    from authorization: planning-only requests default to inline delivery,
    while plan-driven implementation uses a persisted living plan before
    implementation edits. Do not commit or make consequential decisions
    without explicit authorization.
